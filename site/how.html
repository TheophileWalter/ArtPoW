    <meta name="theme-color" content="#07080c" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="A free NFT every month, earned by proof of work." />
    <title>How it works · ArtPoW</title>
    <script>
      // Applies the theme before the first paint: the visitor's choice, else the system preference.
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="app"><p class="muted">Loading…</p></main>
    <script type="module" src="./src/pages/how.js"></script>
  </body>
</html>

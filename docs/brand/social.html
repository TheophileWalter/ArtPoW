<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#07080c}
#hashes{position:absolute;inset:-10px -40px;font:13px/19px "DejaVu Sans Mono";color:#1f2433;white-space:pre;letter-spacing:.5px}
#hashes b{font-weight:400;color:#3d4560}
#hashes i{font-style:normal;background:linear-gradient(90deg,#9b7bff,#3ee6d0);-webkit-background-clip:text;color:transparent;font-weight:700}
.glow{position:absolute;left:50%;top:50%;width:900px;height:460px;transform:translate(-50%,-50%);
 background:radial-gradient(closest-side,rgba(7,8,12,.97) 45%,rgba(7,8,12,.75) 70%,rgba(7,8,12,0))}
.c1{position:absolute;left:-120px;top:-180px;width:520px;height:520px;border-radius:50%;background:radial-gradient(closest-side,rgba(155,123,255,.22),transparent)}
.c2{position:absolute;right:-140px;bottom:-200px;width:560px;height:560px;border-radius:50%;background:radial-gradient(closest-side,rgba(62,230,208,.18),transparent)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.word{font:700 132px/1 "Space Grotesk";letter-spacing:-4px;color:#e9ecf5}
.word span{background:linear-gradient(120deg,#9b7bff,#3ee6d0);-webkit-background-clip:text;color:transparent}
.tag{font:400 25px/1.4 "DejaVu Sans Mono";color:#8a92a8;letter-spacing:1px}
.tag em{font-style:normal;color:#3ee6d0}
.line{width:88px;height:4px;border-radius:2px;background:linear-gradient(90deg,#9b7bff,#3ee6d0);margin:4px 0}
</style></head><body>
<div id="hashes"></div><div class="c1"></div><div class="c2"></div><div class="glow"></div>
<div class="center"><div class="word">Art<span>PoW</span></div><div class="line"></div>
<div class="tag">a new artwork every month · <em>mined, not bought</em></div></div>
<script>
let s=1337;const r=()=>(s=(s*1103515245+12345)%2147483648)/2147483648;
const hx="0123456789abcdef";let out="";
for(let row=0;row<36;row++){let line=" ".repeat(Math.floor(r()*60));
 while(line.replace(/<[^>]+>/g,"").length<300){
  const z=r()<.22?7+Math.floor(r()*4):0;let h="";for(let k=0;k<64-z;k++)h+=hx[1+Math.floor(r()*15)];
  line+=(z?"0x<i>"+"0".repeat(z)+"</i><b>"+h.slice(0,6)+"</b>"+h.slice(6):"0x"+h)+"  ";}
 out+=line+"\n";}
document.getElementById("hashes").innerHTML=out;
</script></body></html>
